name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-gate:
    name: Rust fast gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust with required components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.4

      - name: Build book into a temporary directory
        run: mdbook build book --dest-dir "$RUNNER_TEMP/mdbook"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python offline tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in m0-model-call m1-unified-protocol m2-tool-runtime; do
            python -m unittest discover -s "examples/python/$suite" -p 'test_*.py'
          done

      - name: Compile Python examples
        run: python -m compileall -q examples/python

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check workspace with MSRV
        run: cargo check --workspace

  cross-platform:
    name: Cross-platform workspace check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Run workspace tests
        run: cargo test --workspace
